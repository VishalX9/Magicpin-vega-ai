services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker: context/conversation state is in-memory
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: COMPOSE_WORKERS
        value: "2"
      - key: LLM_TIMEOUT
        value: "6"
      - key: TEAM_NAME
        value: Team Vera
      - key: TEAM_MEMBERS
        value: Sayantan
